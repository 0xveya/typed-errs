[project]
name = "typed-errs"
version = "0.0.0"
description = "Small typed Result and Option values for explicit Python error handling"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Veya Fürst", email = "ghgstefan@gmail.com" }]
keywords = ["result", "option", "error-handling", "typing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/0xveya/typed-errs"

[dependency-groups]
dev = ["basedpyright", "mypy", "pytest", "ruff"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
typed_errs = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
